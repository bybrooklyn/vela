name: VelaMac
options:
  bundleIdPrefix: works.deadsignal
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
packages:
  VelaPackage:
    path: ..
targets:
  Vela:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VelaPackage
        product: VelaCore
      - package: VelaPackage
        product: VelaDomain
      - package: VelaPackage
        product: VelaCrypto
      - package: VelaPackage
        product: VelaStorage
      - package: VelaPackage
        product: VelaTransport
      - package: VelaPackage
        product: VelaSignalBridge
      - package: VelaPackage
        product: VelaSignalCLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.deadsignal.vela
        PRODUCT_NAME: Vela
        MARKETING_VERSION: 0.1.2
        CURRENT_PROJECT_VERSION: 2
        INFOPLIST_FILE: Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Vela.entitlements
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "$(inherited) -D VELA_DEVELOPMENT_MODE"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
    entitlements:
      path: Configuration/Vela.entitlements
  VelaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      - target: Vela
      - package: VelaPackage
        product: VelaDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.deadsignal.vela.tests
        SWIFT_VERSION: 6.0
schemes:
  Vela:
    build:
      targets:
        Vela: all
        VelaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VelaTests
    archive:
      config: Release
